server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des textes servis.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets fingerprintés par Vite : cache long et immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA (React Router) : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
