server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Autorise les téléversements de médias volumineux (vidéos).
    client_max_body_size 200m;

    # Compression des textes servis.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend maison : proxy vers le conteneur `api`. Le préfixe /api/ est
    # retiré (slash final sur proxy_pass), l'API reçoit donc /offers, /media…
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Temps réel SSE : pas de buffering, connexion longue.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Assets fingerprintés par Vite : cache long et immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA (React Router) : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
